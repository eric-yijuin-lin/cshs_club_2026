<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>水果接接樂測試版</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>

<script>
class GameScene extends Phaser.Scene {
  constructor() {
    super("GameScene");
    this.player = null;
    this.items = null;
    this.score = 0;
    this.moveDirection = 0;
    this.gameEnded = false;
  }

  preload() {}

  create() {
    this.cameras.main.setBackgroundColor("#87ceeb");

    this.createTextures();

    this.scoreText = this.add.text(20, 20, "分數：0", {
      fontSize: "28px",
      color: "#ffffff"
    });

    this.debugText = this.add.text(20, 55, "等待產生水果...", {
      fontSize: "18px",
      color: "#ffffff"
    });

    this.items = this.physics.add.group();

    this.player = this.physics.add.sprite(400, 520, "player");
    this.player.body.setAllowGravity(false);
    this.player.setCollideWorldBounds(true);

    this.physics.add.overlap(
      this.player,
      this.items,
      this.hitItem,
      null,
      this
    );

    this.time.addEvent({
      delay: 700,
      callback: this.spawnItem,
      callbackScope: this,
      loop: true
    });

    this.input.on("pointerdown", (pointer) => {
      if (this.gameEnded) {
        this.scene.restart();
        return;
      }

      if (pointer.x < 400) {
        this.moveDirection = -1;
      } else {
        this.moveDirection = 1;
      }
    });

    this.input.on("pointerup", () => {
      this.moveDirection = 0;
    });

    this.add.text(120, 570, "← 點左半邊往左", {
      fontSize: "22px",
      color: "#ffffff"
    });

    this.add.text(500, 570, "點右半邊往右 →", {
      fontSize: "22px",
      color: "#ffffff"
    });
  }

  update() {
    if (this.gameEnded) {
      return;
    }

    this.player.setVelocityX(this.moveDirection * 350);

    this.items.children.iterate((item) => {
      if (item && item.y > 650) {
        item.destroy();
      }
    });
  }

  spawnItem() {
    if (this.gameEnded) {
      return;
    }

    const types = ["apple", "banana", "kiwi", "bomb"];
    const type = Phaser.Utils.Array.GetRandom(types);
    const x = Phaser.Math.Between(50, 750);

    const item = this.physics.add.sprite(x, -30, type);
    item.itemType = type;
    item.body.setAllowGravity(false);
    item.setVelocityY(220);

    this.items.add(item);

    this.debugText.setText("已產生：" + type);
    console.log("spawn item:", type, x);
  }

  hitItem(player, item) {
    if (item.itemType === "bomb") {
      this.endGame();
      return;
    }

    this.score += 10;
    this.scoreText.setText("分數：" + this.score);
    item.destroy();
  }

  endGame() {
    this.gameEnded = true;

    this.items.children.iterate((item) => {
      if (item) {
        item.setVelocityY(0);
      }
    });

    this.add.text(400, 280, "遊戲結束", {
      fontSize: "52px",
      color: "#ff3333"
    }).setOrigin(0.5);

    this.add.text(400, 340, "點擊重新開始", {
      fontSize: "28px",
      color: "#ffffff"
    }).setOrigin(0.5);
  }

  createTextures() {
    let g;

    // 玩家
    g = this.add.graphics();
    g.fillStyle(0x3366ff, 1);
    g.fillRoundedRect(0, 0, 80, 45, 12);
    g.fillStyle(0xffffff, 1);
    g.fillCircle(25, 18, 6);
    g.fillCircle(55, 18, 6);
    g.generateTexture("player", 80, 45);
    g.destroy();

    // 蘋果
    g = this.add.graphics();
    g.fillStyle(0xff3333, 1);
    g.fillCircle(25, 28, 22);
    g.fillStyle(0x228833, 1);
    g.fillEllipse(35, 8, 20, 10);
    g.generateTexture("apple", 55, 55);
    g.destroy();

    // 香蕉
    g = this.add.graphics();
    g.fillStyle(0xffdd33, 1);
    g.fillEllipse(25, 28, 48, 18);
    g.fillStyle(0x87ceeb, 1);
    g.fillEllipse(25, 22, 40, 12);
    g.generateTexture("banana", 55, 55);
    g.destroy();

    // 奇異果
    g = this.add.graphics();
    g.fillStyle(0x8b5a2b, 1);
    g.fillCircle(25, 25, 22);
    g.fillStyle(0x66cc55, 1);
    g.fillCircle(25, 25, 16);
    g.fillStyle(0xffffff, 1);
    g.fillCircle(25, 25, 6);
    g.generateTexture("kiwi", 55, 55);
    g.destroy();

    // 炸彈
    g = this.add.graphics();
    g.fillStyle(0x111111, 1);
    g.fillCircle(25, 30, 22);
    g.lineStyle(4, 0xffaa00, 1);
    g.beginPath();
    g.moveTo(35, 15);
    g.lineTo(48, 3);
    g.strokePath();
    g.generateTexture("bomb", 55, 55);
    g.destroy();
  }
}

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  physics: {
    default: "arcade",
    arcade: {
      debug: false
    }
  },
  scene: GameScene
};

new Phaser.Game(config);
</script>

</body>
</html>
